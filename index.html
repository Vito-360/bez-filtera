<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A5A">
<title>Bez filtera</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#EFE7DA;--surf:#E4DACA;--paper:#FFFDF8;--paper2:#F5EBD0;--ink:#1F1A17;--muted:#5C534A;--navy:#1F2A5A;--navytext:#F6F1E7;--red:#C2331C;--redp:#A32A16;--sel:#CFE0FF;--gold:#F2B705;--warn:#C2185B;--good:#F2B705;--line:#B9AE9E;--off:#D9D1C4;--offtext:#7A7166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif}
body{padding:0 0 env(safe-area-inset-bottom)}
.app{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 14px 130px;min-height:100vh}
.app.home{padding-top:calc(24px + env(safe-area-inset-top))}
.app.handmode{padding-bottom:480px}
.muted{color:var(--muted)}
h2{font:800 17px Archivo,sans-serif;margin:24px 0 10px}

/* ---- logo ---- */
.logo{font-family:Fraunces,serif;font-weight:800;color:var(--navy);text-shadow:3px 3px 0 var(--red);line-height:.95;margin:0}
.logo i{font-style:italic}
.hero{position:relative;height:270px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.hero .deco{position:absolute;width:150px;aspect-ratio:63/88;border:2px solid var(--ink);border-radius:10px}
.hero .d1{background:var(--navy);box-shadow:5px 5px 0 var(--red);transform:translateX(-52px) rotate(-9deg)}
.hero .d2{background:var(--paper);box-shadow:4px 4px 0 var(--ink);transform:translateX(52px) rotate(7deg)}
.hero h1{position:relative;font-size:56px;text-align:center;background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:14px 22px 18px}
.hero h1 span{display:block}
.tagline{text-align:center;font-size:17px;line-height:1.4;margin:0 0 22px}

/* ---- polja i gumbi ---- */
input{width:100%;height:56px;border-radius:8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:500 18px Archivo,sans-serif;padding:0 16px;margin:6px 0}
input::placeholder{color:#8A8076}
input:focus{outline:none;border:3px solid var(--navy);padding:0 15px}
input:disabled{background:var(--surf);color:#8A8076}
.code-input{font:800 26px Fraunces,serif;text-transform:uppercase;letter-spacing:.3em;text-align:center}
button{font:800 20px Archivo,sans-serif;border:2px solid var(--ink);border-radius:8px;min-height:56px;padding:0 18px;cursor:pointer;width:100%;margin:8px 0;color:var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);transition:transform .06s,box-shadow .06s,background .06s}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.primary{background:var(--red);color:#fff}
.primary:active:not(:disabled){background:var(--redp)}
.secondary{background:var(--paper);color:var(--ink)}
.danger{background:var(--paper);color:var(--warn);border-color:var(--warn);box-shadow:3px 3px 0 var(--warn)}
button:disabled{background:var(--off);color:var(--offtext);border-color:var(--line);box-shadow:none;cursor:default}
.or{text-align:center;color:var(--muted);margin:18px 0;font-size:15px;display:flex;align-items:center;gap:12px}
.or::before,.or::after{content:"";flex:1;border-top:2px dashed var(--line)}
.or a{color:var(--navy);font-weight:700}

/* ---- gornja traka ---- */
.topbar{position:sticky;top:0;z-index:30;margin:calc(-1 * env(safe-area-inset-top)) -14px 0;padding:calc(8px + env(safe-area-inset-top)) 14px 0;background:var(--navy);color:var(--navytext);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;transition:background .2s}
.tcode{font:800 20px Fraunces,serif;letter-spacing:.12em}
.tnum{font:800 30px/1 Fraunces,serif;text-align:center;min-width:76px}
.tlogo{font:800 19px Fraunces,serif;text-align:center}
.tlogo i{font-style:italic}
.menubtn{justify-self:end;width:auto;min-height:48px;height:48px;margin:0;padding:0 14px;font-size:16px;background:transparent;color:var(--navytext);border-color:var(--navytext);box-shadow:none}
.menubtn:active:not(:disabled){transform:none;background:rgba(255,255,255,.12)}
.tspace{grid-column:1/-1;height:8px}
.tstrip{grid-column:1/-1;height:7px;margin:8px -14px 0;background:#3A4677}
.tstrip i{display:block;height:100%;width:100%;background:var(--gold);transition:width .25s linear}
.topbar.low{background:var(--warn);color:#fff}
.topbar.low .tstrip{background:#8E0F42}
.topbar.low .tstrip i{background:#fff}

/* ---- karte ---- */
.card{border:2px solid var(--ink);border-radius:10px;font-family:Fraunces,serif;font-weight:600;line-height:1.3;position:relative}
.card.black{background:var(--navy);color:var(--navytext);box-shadow:5px 5px 0 var(--red);aspect-ratio:88/63;padding:20px 22px;font-size:24px;margin:18px 5px 20px 0;display:flex;flex-direction:column;justify-content:center}
.handmode .card.black{aspect-ratio:auto;min-height:150px;font-size:22px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);margin:0 2px}
.fill{color:var(--gold);text-decoration:underline 3px;text-underline-offset:5px}
.pick2{display:inline-block;margin-top:14px;font:800 16px Archivo,sans-serif;background:var(--gold);color:var(--ink);border-radius:6px;padding:4px 12px}
.wcard{background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink);aspect-ratio:63/88;padding:14px;font-size:19px;overflow:hidden}
.wcard.custom{background:var(--paper2)}
.wcard.sel{background:var(--sel);border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy)}
.ord{font-family:Archivo,sans-serif;font-weight:800;color:var(--navy)}
.reader{text-align:center;font-size:18px;margin:16px 0 0}
.reader b{font:800 20px Fraunces,serif;color:var(--navy)}

/* ---- ruka: lepeza ---- */
.handbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(239,231,218,0),var(--bg) 26%)}
.handbar .inner{position:relative;max-width:492px;margin:0 auto}
.stage{position:absolute;left:0;right:0;bottom:calc(100% - 64px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hintpill{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font:700 15px Archivo,sans-serif;text-align:center}
.wcard.big{pointer-events:auto;width:176px;margin:0;padding:16px;font:600 22px/1.28 Fraunces,serif;text-align:left;display:block;min-height:0;color:var(--ink);animation:lift .16s ease-out}
.wcard.big.sel{background:var(--sel)}
.wcard.big.custom{background:var(--paper2)}
@keyframes lift{from{transform:translateY(30px) scale(.8);opacity:.4}to{transform:none;opacity:1}}
.fan{position:relative;height:146px;margin:0 -14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.fc{position:absolute;bottom:4px;left:calc(16px + var(--x) * (100% - 108px));width:76px;aspect-ratio:63/88;transform:translateY(var(--y)) rotate(var(--r));transform-origin:50% 100%;transition:transform .14s ease;padding:8px 7px;font:600 15px/1.2 Fraunces,serif;overflow:hidden;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);pointer-events:none}
.fc.custom{background:var(--paper2)}
.fc.up{transform:translateY(calc(var(--y) - 30px)) rotate(var(--r))}
.fc.sel{background:var(--sel);border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy)}

/* ---- glasanje: okretanje ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;padding:0 5px 0 0;margin-top:12px}
.flip{aspect-ratio:63/88;perspective:900px;cursor:pointer}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.up .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.face.back{background:repeating-linear-gradient(45deg,rgba(255,253,248,.09) 0 6px,transparent 6px 14px),var(--red);display:flex;align-items:center;justify-content:center}
.blogo{font:800 22px/1 Fraunces,serif;color:var(--navytext);text-align:center;border:2px solid var(--navytext);border-radius:8px;padding:10px 12px}
.blogo span{display:block}
.blogo i{font-style:italic}
.face.front{transform:rotateY(180deg);background:var(--paper);color:var(--ink);font:600 19px/1.3 Fraunces,serif;padding:14px}
.face.front.long{font-size:16px}
.flip.sel .face.front{background:var(--sel);border:3px solid var(--navy);box-shadow:4px 4px 0 var(--navy)}
.flip.mine{cursor:default}
.flip.mine .face.front{background:var(--surf);color:var(--muted);border-style:dashed;box-shadow:none}
.yours{position:absolute;left:0;right:0;bottom:0;background:var(--off);border-top:2px dashed var(--line);font:800 15px Archivo,sans-serif;text-align:center;padding:7px;color:var(--ink)}

/* ---- rezultati ---- */
.wcard.win{width:min(210px,58%);margin:12px auto 26px;padding:0;font-size:22px;box-shadow:6px 6px 0 var(--gold);transform:rotate(-2deg);display:flex;flex-direction:column;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.7) rotate(4deg);opacity:0}to{transform:rotate(-2deg);opacity:1}}
.wband{background:var(--gold);border-bottom:2px solid var(--ink);padding:8px 10px;font:800 15px/1.25 Archivo,sans-serif;text-align:center}
.wtext{padding:16px}
.wcard.res{display:flex;flex-direction:column;padding:0}
.wcard.res .wtext{flex:1;padding:12px}
.rmeta{border-top:2px solid var(--ink);background:var(--surf);font:700 15px Archivo,sans-serif;text-align:center;padding:8px 6px}
.nowin{text-align:center;font:800 22px Fraunces,serif;margin:16px 0}

/* ---- popisi i ostalo ---- */
.codecard{background:var(--navy);color:var(--navytext);border:2px solid var(--ink);border-radius:10px;box-shadow:5px 5px 0 var(--red);padding:16px 20px 18px;text-align:center;margin:18px 5px 14px 0}
.codecard .lbl{font:700 15px Archivo,sans-serif;color:#C9CFE6}
.bigcode{font:800 72px/1 Fraunces,serif;letter-spacing:.14em;margin:8px 0 4px .14em}
.players{display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden}
.prow{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:8px 14px;border-bottom:1px solid var(--surf);font-weight:700;font-size:18px}
.prow:last-child{border-bottom:0}
.prow.away{color:var(--muted)}
.prow .sc{font:800 20px Fraunces,serif}
.tag{font-size:15px;color:var(--muted);margin-left:8px;font-weight:500}
.ok{color:var(--navy);font-weight:800}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 14px;margin:8px 0;font-weight:700;font-size:18px}
.toggle input{width:28px;height:28px;margin:0;padding:0;border:0;accent-color:var(--red);flex:none}
.toggle.soft{background:var(--surf);border-color:var(--surf)}
.toggle .sub{display:block;font-weight:500;font-size:15px;color:var(--muted)}
.toggle input.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--line);border:2px solid var(--ink);position:relative}
.toggle input.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);box-sizing:border-box;transition:transform .15s}
.toggle input.sw:checked{background:var(--red)}
.toggle input.sw:checked::before{transform:translateX(20px)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:16px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(239,231,218,0),var(--bg) 30%)}
.bar .inner{max-width:492px;margin:0 auto}
.note{background:var(--surf);border-radius:8px;padding:14px;margin:12px 0;color:var(--muted);font-weight:700;font-size:16px;text-align:center}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--warn);color:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:12px 18px;border-radius:8px;font-weight:700;font-size:16px;z-index:70;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(31,26,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:65}
.sheet{background:var(--bg);width:100%;max-width:520px;border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px;font:800 26px Fraunces,serif;color:var(--navy)}
.sheet p{font-size:16px;line-height:1.4}
.footer{color:var(--muted);font-size:15px;text-align:center;margin-top:34px;line-height:1.4}
.footer a{color:var(--muted)}
.handmode .footer{display:none}
.champ{text-align:center;margin:26px 0 10px}
.champ .nm{font:800 56px/1.05 Fraunces,serif;color:var(--navy);text-shadow:3px 3px 0 var(--gold);margin-top:6px}
.champ .pts{font-weight:700;font-size:18px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<script>
const SUPABASE_URL = "https://gxjziipwrxzjibzlakgq.supabase.co";
const SUPABASE_KEY = "sb_publishable_4eocLcYh6eKvRrGqTChA1Q_aw6XztH_";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ERR = {
  NEMA_SOBE:"Soba s tim kodom ne postoji.", NEMA_IGRACA:"Više nisi u sobi.", IME_ZAUZETO:"To ime je već u sobi. Uzmi drugo.",
  IME_PRAZNO:"Upiši ime.", SOBA_PUNA:"Soba je puna (20 igrača).", PREMALO_IGRACA:"Treba barem 3 igrača.",
  SAMO_HOST:"To može samo host.", IGRA_TRAJE:"Igra je već u tijeku.", NIJE_VRIJEME:"Prekasno, runda je otišla dalje.",
  CEKAS_RUNDU:"Uključuješ se od sljedeće runde.", VEC_BACENO:"Već si bacio.", KRIVI_BROJ:"Odaberi točan broj karata.",
  NIJE_TVOJA_KARTA:"Ta karta više nije u tvojoj ruci.", NE_ZA_SEBE:"Ne možeš glasati za sebe.", VEC_DODANO:"Već si dodao odgovor u ovoj igri.",
  PREKRATKO:"Odgovor je prekratak.", PREDUGO:"Najviše 80 znakova."
};
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

let token = ls.get("bf_token"), S = null, offset = 0, sel = [], voteSel = null, channel = null, channelCode = null, busy = false, lastKey = "";
// Ekran uvijek upaljen je sada uključen po defaultu (isključen samo ako ga je igrač sam ugasio).
let wakeOn = ls.get("bf_wake") !== "0", wakeLock = null;
// Stanje samo za prikaz (ne ide u bazu):
let lifted = null, drag = null;                 // podignuta karta u lepezi
let flip = { k: "", ids: new Set() };           // okrenute karte u glasanju, po rundi
let tot = { k: "", v: 0 };                      // ukupno trajanje faze za traku timera
const DUR = { playing: 90, voting: 45 };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); }
function errMsg(e){ const m = (e && (e.message||e.details)) || String(e); for (const k in ERR) if (m.includes(k)) return ERR[k]; return "Nešto nije uspjelo. Provjeri internet i pokušaj opet."; }

async function call(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw error;
  return data;
}
async function act(fn, args, after){
  if (busy) return; busy = true;
  try { const d = await call(fn, args); if (after) after(d); ping(); await refresh(); }
  catch(e){ toast(errMsg(e)); await refresh(); }
  finally { busy = false; }
}

// ---- Realtime: kad netko nešto napravi, svi odmah osvježe; uz to i provjera svake 2 s ----
function ensureChannel(code){
  if (channelCode === code) return;
  if (channel) sb.removeChannel(channel);
  channelCode = code;
  channel = sb.channel("soba-" + code).on("broadcast", { event: "refresh" }, () => refresh()).subscribe();
}
function ping(){ try { channel && channel.send({ type:"broadcast", event:"refresh", payload:{} }); } catch(e){} }

async function refresh(){
  if (!token) { S = null; render(); return; }
  try {
    const d = await call("get_state", { p_token: token });
    if (d && d.error === "NEMA_IGRACA") { ls.del("bf_token"); token = null; S = null; render(); return; }
    offset = new Date(d.server_now).getTime() - Date.now();
    const prev = S; S = d;
    if (!prev || prev.room.round !== S.room.round || prev.room.phase !== S.room.phase) { sel = []; voteSel = null; }
    sel = sel.filter(id => S.me.hand.some(h => h.id === id));
    ensureChannel(S.room.code);
    render();
  } catch(e){ /* mreža: probaj opet za 2 s */ }
}
setInterval(refresh, 2000);
setInterval(tickTimer, 250);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); if (wakeOn) lockWake(); } });
// Prvi (i svaki sljedeći) dodir: ako je zaključavanje ekrana palo, traži ga ponovno. Neki preglednici traže dodir.
document.addEventListener("pointerdown", () => { if (wakeOn && (!wakeLock || wakeLock.released)) lockWake(); }, { passive: true });

// ---- Ekran uvijek upaljen ----
async function lockWake(){ try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); } } catch(e){} }
async function toggleWake(){
  wakeOn = !wakeOn; ls.set("bf_wake", wakeOn ? "1" : "0");
  if (wakeOn) { await lockWake(); if (!("wakeLock" in navigator)) toast("Tvoj preglednik ovo ne podržava."); }
  else if (wakeLock) { try { await wakeLock.release(); } catch(e){} wakeLock = null; }
  lastKey = ""; render();
}
if (wakeOn) lockWake();

function secondsLeft(){ if (!S || !S.room.ends_at) return null; return Math.max(0, Math.ceil((new Date(S.room.ends_at).getTime() - (Date.now() + offset)) / 1000)); }
function fmtT(s){ if (s === null || s === undefined) return ""; return s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : String(s); }
function timerPct(s){
  if (s === null || !S) return 100;
  const k = S.room.phase + ":" + S.room.round;
  if (tot.k !== k) tot = { k, v: Math.max(DUR[S.room.phase] || 0, s) }; else tot.v = Math.max(tot.v, s);
  return tot.v ? Math.min(100, s / tot.v * 100) : 0;
}
function tickTimer(){
  const el = $("#timer"); if (!el) return; const s = secondsLeft(); if (s === null) return;
  el.textContent = fmtT(s);
  const bar = $("#topbar"); bar && bar.classList.toggle("low", s <= 10);
  const f = $("#tfill"); f && (f.style.width = timerPct(s) + "%");
  if (s === 0) refresh();
}

function blackHTML(text, fills){
  let i = 0;
  const parts = esc(text).split("___");
  return parts.map((p, k) => k === 0 ? p : (fills && fills[i] !== undefined ? `<span class="fill">${esc(String(fills[i++]).replace(/\.$/, ""))}</span>` : `<span class="blank"></span>`) + p).join("");
}
function glasova(n){ return n === 1 ? "glas" : (n >= 2 && n <= 4 ? "glasa" : "glasova"); }
const CROWN = `<svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="#F2B705" stroke="#1F1A17" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>`;

// ---- Prikaz ----
function render(){
  // server_now se mijenja svake 2 s; bez njega u ključu ekran se ne crta ispočetka bez potrebe (i ne prekida animacije)
  const key = JSON.stringify([S ? { ...S, server_now: null } : null, sel, voteSel, wakeOn]);
  if (key === lastKey) return; lastKey = key;
  drag = null;
  const app = $("#app");
  if (!S) { app.className = "app home"; app.innerHTML = homeHTML(); bindHome(); return; }
  const r = S.room, me = S.me;
  if (lifted !== null && !me.hand.some(h => h.id === lifted)) lifted = null;
  const timed = r.ends_at && ["playing","voting","results"].includes(r.phase);
  const s = timed ? secondsLeft() : null;
  let h = `<div class="topbar ${timed && s !== null && s <= 10 ? "low" : ""}" id="topbar"><span class="tcode">${esc(r.code)}</span>${timed ? `<span class="tnum" id="timer">${fmtT(s)}</span>` : `<span class="tlogo">Bez <i>filtera</i></span>`}<button class="menubtn" id="menuBtn">Izbornik</button>${timed ? `<div class="tstrip"><i id="tfill" style="width:${timerPct(s)}%"></i></div>` : `<div class="tspace"></div>`}</div>`;
  const handMode = r.phase === "playing" && !me.waiting && !me.submitted;
  if (r.phase === "lobby") h += lobbyHTML();
  else if (r.phase === "ended") h += endedHTML();
  else if (me.waiting) h += waitingHTML();
  else if (r.phase === "playing") h += playingHTML();
  else if (r.phase === "voting") h += votingHTML();
  else if (r.phase === "results") h += resultsHTML();
  h += `<div class="footer">Paket Klasici prema <a href="https://www.cardsagainsthumanity.com/" target="_blank" rel="noopener">Cards Against Humanity</a>, licenca <a href="https://creativecommons.org/licenses/by-nc-sa/2.0/" target="_blank" rel="noopener">CC BY-NC-SA 2.0</a>.</div>`;
  app.className = "app" + (handMode ? " handmode" : "");
  app.innerHTML = h;
  bindGame();
}

function homeHTML(){
  const params = new URLSearchParams(location.search);
  const k = (params.get("k") || "").toUpperCase();
  return `<div class="hero"><div class="deco d1" aria-hidden="true"></div><div class="deco d2" aria-hidden="true"></div><h1 class="logo"><span>Bez</span><span><i>filtera</i></span></h1></div>
  <p class="tagline muted">Kartaška igra za ekipu. Svatko na svom mobitelu.</p>
  <input id="name" placeholder="Tvoje ime" maxlength="20" value="${esc(ls.get("bf_name") || "")}" autocomplete="nickname" aria-label="Tvoje ime">
  ${k ? "" : `<button class="primary" id="createBtn">Napravi sobu</button><div class="or">ili uđi u postojeću</div>`}
  <input id="code" class="code-input" placeholder="KOD" maxlength="4" value="${esc(k)}" autocomplete="off" aria-label="Kod sobe">
  <button class="${k ? "primary" : "secondary"}" id="joinBtn">Uđi u sobu</button>
  ${k ? `<div class="or"><a href="${location.pathname}">ili napravi novu sobu</a></div>` : ""}`;
}
function bindHome(){
  const nm = () => { const v = $("#name").value.trim(); if (!v) { toast(ERR.IME_PRAZNO); return null; } ls.set("bf_name", v); return v; };
  const done = d => { token = d.token; ls.set("bf_token", token); history.replaceState(null, "", location.pathname); };
  $("#createBtn") && ($("#createBtn").onclick = () => { const n = nm(); if (n) act("create_room", { p_name: n }, done); });
  $("#joinBtn").onclick = () => { const n = nm(); const c = $("#code").value.trim().toUpperCase(); if (!n) return; if (c.length !== 4) { toast("Kod ima 4 slova."); return; } act("join_room", { p_code: c, p_name: n }, done); };
}

function playersHTML(showDone){
  return `<div class="players">${S.players.map(p => `<div class="prow ${p.present ? "" : "away"}"><span>${esc(p.name)}${p.host ? '<span class="tag">host</span>' : ""}${p.waiting ? '<span class="tag">od sljedeće runde</span>' : ""}${!p.present ? '<span class="tag">nije tu</span>' : ""}</span><span>${showDone && p.done ? '<span class="ok">✓</span> ' : ""}<span class="sc">${esc(p.score)}</span></span></div>`).join("")}</div>`;
}

function wakeToggleHTML(){
  return `<label class="toggle soft"><span>Ekran uvijek upaljen<span class="sub">Mobitel neće zaspati usred runde</span></span><input type="checkbox" class="sw" id="wakeL" role="switch" ${wakeOn ? "checked" : ""}></label>`;
}

function lobbyHTML(){
  const r = S.room, me = S.me, n = S.players.filter(p => p.present).length;
  const link = location.origin + location.pathname + "?k=" + r.code;
  return `<div class="codecard"><div class="lbl">Kod sobe</div><div class="bigcode">${esc(r.code)}</div><div class="lbl">Pokaži ekran ili pošalji poveznicu.</div></div>
  <button class="secondary" id="shareBtn" data-link="${esc(link)}">Kopiraj poveznicu za ekipu</button>
  <h2>Igrači (${S.players.length})</h2>${playersHTML(false)}
  ${me.is_host ? `<h2>Paketi</h2>
    <label class="toggle">Pristojno <input type="checkbox" checked disabled></label>
    <label class="toggle">18+ <input type="checkbox" id="p18" ${r.include_18 ? "checked" : ""}></label>
    <label class="toggle">Klasici <input type="checkbox" id="pkl" ${r.include_klasici ? "checked" : ""}></label>`
  : `<div class="note">Paketi: Pristojno${r.include_18 ? " + 18+" : ""}${r.include_klasici ? " + Klasici" : ""}. Čekamo da host krene.</div>`}
  <h2>Postavke</h2>${wakeToggleHTML()}
  ${me.can_add ? `<button class="secondary" id="addBtn">Dodaj svoj odgovor</button>` : `<div class="note">Tvoj odgovor je dodan ✓</div>`}
  ${me.is_host ? `<div class="bar"><div class="inner"><button class="primary" id="startBtn" ${n < r.min_players ? "disabled" : ""}>${n < r.min_players ? `Treba još ${r.min_players - n}` : "Kreni"}</button></div></div>` : ""}`;
}

// ---- Ruka (lepeza) ----
function fanHTML(){
  const hand = S.me.hand, n = hand.length, need = S.room.pick;
  return hand.map((c, i) => {
    const d = i - (n - 1) / 2, x = n > 1 ? i / (n - 1) : 0.5, si = sel.indexOf(c.id);
    return `<div class="fc ${c.id === lifted ? "up" : ""} ${si >= 0 ? "sel" : ""} ${c.custom ? "custom" : ""}" data-i="${i}" style="--x:${x};--r:${(d * 4).toFixed(1)}deg;--y:${(d * d * 2).toFixed(1)}px;z-index:${c.id === lifted ? 50 : i}">${si >= 0 && need > 1 ? `<span class="ord">${si + 1}.</span> ` : ""}${esc(c.text)}</div>`;
  }).join("");
}
function stageHTML(){
  const need = S.room.pick, c = lifted === null ? null : S.me.hand.find(h => h.id === lifted);
  if (!c) return `<div class="hintpill">Dodirni ili povuci prstom preko karata</div>`;
  const i = sel.indexOf(c.id);
  const hint = i >= 0 ? (need > 1 ? `Odabrana kao ${i + 1}. Dodirni za poništavanje.` : "Odabrano. Dodirni za poništavanje.")
    : (need > 1 && sel.length >= need ? `Već imaš ${need} karte. Poništi jednu.` : "Dodirni kartu za odabir");
  return `<div class="hintpill">${hint}</div><button class="wcard big ${i >= 0 ? "sel" : ""} ${c.custom ? "custom" : ""}" id="liftBig">${i >= 0 && need > 1 ? `<span class="ord">${i + 1}.</span> ` : ""}${esc(c.text)}</button>`;
}
function playingHTML(){
  const r = S.room, me = S.me;
  if (me.submitted) {
    const left = S.players.filter(p => !p.done && !p.waiting && p.present).map(p => esc(p.name));
    return `<div class="card black"><div>${blackHTML(r.black)}</div></div><div class="note">Bacio si ✓ ${left.length ? "Čekamo: " + left.join(", ") : ""}</div>${playersHTML(true)}${addHTML()}`;
  }
  const need = r.pick;
  return `<div class="card black"><div>${blackHTML(r.black)}</div>${need > 1 ? `<div><span class="pick2">Izvuci ${need}</span></div>` : ""}</div>
  ${addHTML()}
  <div class="handbar"><div class="inner">
    <div class="stage" id="stage">${stageHTML()}</div>
    <div class="fan" id="fan" role="listbox" aria-label="Tvoje karte">${fanHTML()}</div>
    <button class="primary" id="playBtn" ${sel.length !== need ? "disabled" : ""}>${sel.length === need ? "Baci" : need > 1 ? `Odaberi ${need} karte (${sel.length}/${need})` : "Odaberi kartu"}</button>
  </div></div>`;
}
function toggleSel(id){
  const need = S.room.pick;
  if (sel.includes(id)) sel = sel.filter(x => x !== id);
  else if (need === 1) sel = [id];
  else if (sel.length < need) sel = [...sel, id];
  render();
}
function setLift(id){
  lifted = id;
  document.querySelectorAll("#fan .fc").forEach((el, i) => { const up = S.me.hand[i] && S.me.hand[i].id === id; el.classList.toggle("up", up); el.style.zIndex = up ? 50 : i; });
  const st = $("#stage"); if (st) { st.innerHTML = stageHTML(); bindStage(); }
}
function bindStage(){ const b = $("#liftBig"); b && (b.onclick = () => lifted !== null && toggleSel(lifted)); }
function bindFan(){
  const fan = $("#fan"); if (!fan) return;
  const hand = S.me.hand, W = 76, PAD = 16;
  const idxAt = e => { const r = fan.getBoundingClientRect(), n = hand.length; if (n <= 1) return 0; const t = (e.clientX - r.left - PAD - W / 2) / (r.width - 2 * PAD - W); return Math.max(0, Math.min(n - 1, Math.round(t * (n - 1)))); };
  fan.onpointerdown = e => { if (!hand.length) return; e.preventDefault(); try { fan.setPointerCapture(e.pointerId); } catch(_){} const c = hand[idxAt(e)]; drag = { moved: false, was: lifted === c.id }; setLift(c.id); };
  fan.onpointermove = e => { if (!drag) return; const c = hand[idxAt(e)]; if (c.id !== lifted) { drag.moved = true; setLift(c.id); } };
  fan.onpointerup = () => { if (!drag) return; const d = drag; drag = null; if (!d.moved && d.was) toggleSel(lifted); };
  fan.onpointercancel = () => { drag = null; };
  bindStage();
}

// ---- Glasanje (okretanje karata) ----
function readerName(){
  const pres = S.players.filter(p => p.present).sort((a, b) => String(a.name).localeCompare(String(b.name), "hr"));
  return pres.length ? pres[S.room.round % pres.length].name : "";
}
function flipSync(){ const k = S.room.code + ":" + S.room.round; if (flip.k !== k) flip = { k, ids: new Set() }; }
function isUp(s){ return !!s.mine || !!S.me.voted_for || flip.ids.has(String(s.id)); }
function voteState(){ const o = S.submissions.filter(s => !s.mine); const up = o.filter(isUp).length; return { up, total: o.length, all: up === o.length }; }
function voteHint(v){ return S.me.voted_for ? "Glasao si ✓ Čekamo ostale." : !v.all ? `Dodiruj karte da ih okreneš (${v.up} od ${v.total})` : voteSel ? "Odabrano. Potvrdi glas." : "Pročitajte naglas i odaberite najbolji."; }
function voteBtnText(v){ return !v.all ? `Okreni sve karte (${v.up}/${v.total})` : voteSel ? "Glasaj" : "Odaberi najbolji"; }
function votingHTML(){
  flipSync();
  const r = S.room, voted = S.me.voted_for, v = voteState();
  return `<div class="reader">Naglas čita: <b>${esc(readerName())}</b></div>
  <div class="card black"><div>${blackHTML(r.black)}</div></div>
  <p class="muted" id="vhint" style="margin:0;font-size:16px;font-weight:700;text-align:center">${voteHint(v)}</p>
  <div class="grid2">${S.submissions.map(s => { const id = String(s.id), t = s.texts.map(esc).join(" / "), on = (voteSel === id || (voted !== null && voted !== undefined && String(voted) === id));
    return `<div class="flip ${isUp(s) ? "up" : ""} ${s.mine ? "mine" : ""} ${on ? "sel" : ""}" data-flip="${esc(id)}" role="button" aria-label="${isUp(s) ? "Odgovor" : "Okreni kartu"}">
      <div class="fi"><div class="face back"><span class="blogo"><span>Bez</span><span><i>filtera</i></span></span></div>
      <div class="face front ${t.length > 70 ? "long" : ""}">${t}${s.mine ? '<span class="yours">tvoja</span>' : ""}</div></div></div>`; }).join("")}</div>
  ${voted ? "" : `<div class="bar"><div class="inner"><button class="primary" id="voteBtn" ${voteSel && v.all ? "" : "disabled"}>${voteBtnText(v)}</button></div></div>`}`;
}
function bindFlips(){
  document.querySelectorAll("[data-flip]").forEach(el => el.onclick = () => {
    const id = el.dataset.flip, s = S.submissions.find(x => String(x.id) === id); if (!s) return;
    if (!isUp(s)) {
      flip.ids.add(id); el.classList.add("up");
      const v = voteState(), h = $("#vhint"), b = $("#voteBtn");
      h && (h.textContent = voteHint(v)); b && (b.textContent = voteBtnText(v));
      if (v.all) setTimeout(() => { lastKey = ""; render(); }, 650);
      return;
    }
    if (s.mine || S.me.voted_for || !voteState().all) return;
    voteSel = String(s.id); render();
  });
}

// ---- Rezultati ----
function resultsHTML(){
  const r = S.room;
  const subs = [...S.submissions].sort((a, b) => b.votes - a.votes);
  const win = subs.filter(s => s.winner), rest = subs.filter(s => !s.winner);
  return `<div class="card black"><div>${blackHTML(r.black, win[0] ? win[0].texts : null)}</div></div>
  ${win.length ? win.map(w => `<div class="card wcard win"><div class="wband">Pobjednik · ${esc(w.player)} · ${esc(w.votes)} ${glasova(w.votes)}</div><div class="wtext">${w.texts.map(esc).join(" / ")}</div></div>`).join("") : `<div class="nowin">Nitko nije dobio glas</div>`}
  ${rest.length ? `<div class="grid2">${rest.map(s => `<div class="card wcard res"><div class="wtext">${s.texts.map(esc).join(" / ")}</div><div class="rmeta">${esc(s.player)}${s.auto ? " (bacio sustav)" : ""} · ${esc(s.votes)} ${glasova(s.votes)}</div></div>`).join("")}</div>` : ""}
  <h2>Bodovi</h2>${playersHTML(false)}`;
}

function waitingHTML(){
  return `<div class="card black"><div>${blackHTML(S.room.black || "Igra je u tijeku.")}</div></div><div class="note">Ušao si usred runde. Uključuješ se od sljedeće, karte već imaš.</div>${playersHTML(false)}${addHTML()}`;
}

function endedHTML(){
  const top = S.players[0];
  const champs = top ? S.players.filter(p => p.score === top.score) : [];
  return `<div class="champ">${CROWN}<div class="nm">${champs.map(p => esc(p.name)).join(" i ")}</div>${top ? `<div class="pts">${champs.length > 1 ? "dijele pobjedu sa" : "pobjeđuje sa"} ${esc(top.score)} ${top.score === 1 ? "bodom" : "bodova"}</div>` : ""}</div>
  <h2>Konačni poredak</h2>${playersHTML(false)}
  ${S.me.is_host ? `<div class="bar"><div class="inner"><button class="primary" id="startBtn">Nova igra</button></div></div>` : `<div class="note">Host može pokrenuti novu igru.</div>`}`;
}

function addHTML(){ return S.me.can_add ? `<button class="secondary" id="addBtn" style="margin-top:14px">Dodaj svoj odgovor</button>` : ""; }

function bindGame(){
  bindFan();
  bindFlips();
  const b = id => document.getElementById(id);
  b("playBtn") && (b("playBtn").onclick = () => act("play_cards", { p_token: token, p_cards: sel }, () => { sel = []; lifted = null; }));
  b("voteBtn") && (b("voteBtn").onclick = () => voteSel && voteState().all && act("vote", { p_token: token, p_submission: voteSel }));
  b("startBtn") && (b("startBtn").onclick = () => { if (wakeOn) lockWake(); act("start_game", { p_token: token }); });
  b("p18") && (b("p18").onchange = () => act("set_packs", { p_token: token, p_18: b("p18").checked, p_klasici: b("pkl").checked }));
  b("pkl") && (b("pkl").onchange = () => act("set_packs", { p_token: token, p_18: b("p18").checked, p_klasici: b("pkl").checked }));
  b("wakeL") && (b("wakeL").onchange = toggleWake);
  b("addBtn") && (b("addBtn").onclick = openAdd);
  b("menuBtn") && (b("menuBtn").onclick = openMenu);
  b("shareBtn") && (b("shareBtn").onclick = async () => { try { await navigator.clipboard.writeText(b("shareBtn").dataset.link); toast("Poveznica kopirana. Pošalji je ekipi."); } catch(e) { toast(b("shareBtn").dataset.link); } });
}

function sheet(html, bind){
  $("#overlay").innerHTML = `<div class="modal" id="modal"><div class="sheet" role="dialog">${html}</div></div>`;
  $("#modal").onclick = e => { if (e.target.id === "modal") closeSheet(); };
  bind && bind();
}
function closeSheet(){ $("#overlay").innerHTML = ""; }

function openAdd(){
  sheet(`<h3>Dodaj svoj odgovor</h3><p class="muted" style="margin:0 0 8px">Jedan po igri. Dobit će ga netko drugi u sljedećih par izvlačenja i nitko neće znati da je tvoj. Ostaje samo u ovoj sobi.</p>
  <input id="addText" maxlength="80" placeholder="npr. Šime kad popije treće pivo" aria-label="Tvoj odgovor">
  <button class="primary" id="addOk">Dodaj</button><button class="secondary" id="addNo">Odustani</button>`, () => {
    $("#addText").focus();
    $("#addNo").onclick = closeSheet;
    $("#addOk").onclick = () => { const t = $("#addText").value.trim(); if (t.length < 2) { toast(ERR.PREKRATKO); return; } closeSheet(); act("add_answer", { p_token: token, p_text: t }, () => toast2("Odgovor dodan ✓")); };
  });
}
function toast2(m){ const d=document.createElement("div"); d.className="toast"; d.style.background="var(--good)"; d.style.color="#000"; d.textContent=m; document.body.appendChild(d); setTimeout(()=>d.remove(),2500); }

function openMenu(){
  const host = S.me.is_host, inGame = ["playing","voting","results"].includes(S.room.phase);
  sheet(`<h3>${esc(S.me.name)} · soba ${esc(S.room.code)}</h3>
  <label class="toggle">Ekran uvijek upaljen <input type="checkbox" class="sw" id="wakeT" role="switch" ${wakeOn ? "checked" : ""}></label>
  ${host && inGame ? `<button class="secondary" id="endBtn">Završi igru i pokaži poredak</button>` : ""}
  <button class="danger" id="leaveBtn">Izađi iz sobe</button>
  <button class="secondary" id="closeBtn">Zatvori</button>`, () => {
    $("#wakeT").onchange = toggleWake;
    $("#closeBtn").onclick = closeSheet;
    $("#endBtn") && ($("#endBtn").onclick = () => sheet(`<h3>Završiti igru?</h3><p class="muted">Svima se prikazuje konačni poredak.</p><button class="primary" id="y">Da, završi</button><button class="secondary" id="n">Ne</button>`, () => { $("#n").onclick = closeSheet; $("#y").onclick = () => { closeSheet(); act("end_game", { p_token: token }); }; }));
    $("#leaveBtn").onclick = () => sheet(`<h3>Izaći iz sobe?</h3><p class="muted">Bodovi ti se gube. Možeš ući ponovno s kodom.</p><button class="danger" id="y">Izađi</button><button class="secondary" id="n">Ostani</button>`, () => { $("#n").onclick = closeSheet; $("#y").onclick = async () => { closeSheet(); try { await call("leave_room", { p_token: token }); ping(); } catch(e){} ls.del("bf_token"); token = null; S = null; lastKey = ""; render(); }; });
  });
}

refresh();
render();
</script>
</body>
</html>
